<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://raw.githubusercontent.com/chen-k-06/anagame/main/favicon.jpg" />
    <title>Anagame</title>
</head>

<body>
    <div id="main-container">
        <div id="left-container">
            <div id="top-bar">
                <h1>Anagame</h1>
                <button id="play-button">▶︎</button>
                <!-- || -->
            </div>
            <div id="left-center"></div>
        </div>
        <div id="right-container">
            <div id="difficulty-bar"></div>
            <div id="clock-bar">
                <div id="timer">60:00</div>
            </div>
            <div id="played-words"></div>
            <div id="stats"></div>
        </div>
    </div>
    <div id="lower-bar">
        <a href=""> <button id="refresh">↻</button>
        </a>
        <button id="hint">Get a hint</button>
        <!-- Needs javascript -->
        <a href="https://github.com/chen-k-06/Anagame" target="_blank"> <button id="github">GitHub Repo</button>
        </a>
        <button id="how-to">How to play</button>
    </div>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://raw.githubusercontent.com/chen-k-06/anagame/main/favicon.jpg" />
    <title>Anagame</title>
</head>

<body>
    <div id="main-container">
        <div id="left-container">
            <div id="top-bar">
                <h1>ANAGAME</h1>
                <button id="play-button">▶︎</button>
                <!-- || -->
            </div>
            <div id="left-center">
                <div id="tile-0">?</div>
                <div id="tile-1">?</div>
                <div id="tile-2">?</div>
                <div id="tile-3">?</div>
                <div id="tile-4">?</div>
                <div id="tile-5">?</div>
                <div id="tile-6">?</div>
            </div>
        </div>
        <div id="right-container">
            <div id="difficulty-bar">DIFFICULTY: <input type="range" id="slider" min="0" max="60" step="1" value="20">
            </div>
            <div id="clock-bar">TIME REMAINING:&nbsp;&nbsp;
                <div id="timer">60:00</div> SECONDS
            </div>
            <div id="played-words">PLAYED WORDS: </div>
            <div id="stats">STATS: </div>
        </div>
    </div>
    <div id="lower-bar">
        <a href=""> <button id="refresh">↻</button>
        </a>
        <button id="how-to">How to play</button>
        <button id="hint">Get a hint</button>
        <!-- Needs javascript -->
        <a href="https://github.com/chen-k-06/Anagame" target="_blank"> <button id="github">GitHub Repo</button>
        </a>
    </div>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="https://raw.githubusercontent.com/chen-k-06/anagame/main/favicon.jpg" />
    <title>Anagame</title>
</head>

<body>
    <div id="main-container">
        <div id="left-container">
            <div id="top-bar">
                <h1>ANAGAME</h1>
                <button id="play-button">▶︎</button>
                <!-- || -->
            </div>
            <div id="left-center">
                <div id="tile-0" class="tile">?</div>
                <div id="tile-1" class="tile">?</div>
                <div id="tile-2" class="tile">?</div>
                <div id="tile-3" class="tile">?</div>
                <div id="tile-4" class="tile">?</div>
                <div id="tile-5" class="tile">?</div>
                <div id="tile-6" class="tile">?</div>
            </div>
        </div>
        <div id="right-container">
            <div id="difficulty-bar">DIFFICULTY: <input type="range" id="slider" min="0" max="20" step="1" value="15">
            </div>
            <label id="distribution-toggle"> UNIFORM<input type="range" id="scrabble-uniform" min="0" max="1" step="1"
                    value="0"> SCRABBLE
            </label>
            <div id="clock-bar">TIME REMAINING:&nbsp;&nbsp;
                <div id="timer">60:00</div> SECONDS
            </div>
            <div id="played-words">ENTER ANAGRAM PAIRS (ex: ate, eat): </div>
            <div id="stats">STATS: </div>
        </div>
    </div>
    <div id="lower-bar">
        <a href=""> <button id="refresh">↻</button>
        </a>
        <button id="how-to">How to play</button>
        <div id="how-to-popup" class="popup hidden">
            <div class="how-to-content">
                <h2 id="how-to-message"></h2>
                <video id="demo-video" autoplay muted loop width="800" height="560" controls style="display: block;">
                    <source src="anagame_demo.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <button id="close-popup-button">Play game!</button>
            </div>
        </div>
        <button id="hint">Get a hint</button>
        <div id="hint-popup">
            <p id="hint-content"></p>
            <button id="close-hint-button">Close</button>
        </div>
        <!-- Needs javascript -->
        <a href="https://github.com/chen-k-06/Anagame" target="_blank"> <button id="github">GitHub Repo</button>
        </a>
    </div>

    <script src="script.js"></script>
</body>

</html>
